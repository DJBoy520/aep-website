# ============================================================
# AEP Website - Nginx production site config
# 功能：Gzip 压缩 / 静态资源长缓存 / 静态多页精确匹配与语言化 404
# ============================================================

# 按请求路径前缀选择 404 页面：/en 前缀回落到英文 404（构建产物 /en/404/index.html），
# 其余回落中文 404（构建产物 /404.html）
# （map 位于 http 上下文：本文件由 nginx 主配置的 http 块 include）
map $uri $aep_not_found_page {
    ~^/en(/|$) /en/404/;
    default     /404.html;
}

server {
    listen 80;
    server_name _;

    # 目录重定向用相对路径（Location: /protocol/），避免丢失端口号
    # 默认 absolute_redirect on 会用 $host 生成绝对 URL（不含端口），
    # 导致 http://host:8080/protocol 被 301 到 http://host/protocol/（丢端口）
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 404 错误页配置（按语言前缀回落） ----------
    error_page 404 $aep_not_found_page;

    # ---------- Gzip 压缩 ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    # 预压缩文件支持（若 dist 内含 .gz 文件可直接服务）
    gzip_static on;

    # ---------- 静态资源长缓存（带哈希文件名，可 immutable） ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ---------- HTML 不缓存或短缓存 ----------
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    location = /en/404/ {
        add_header Cache-Control "no-cache";
    }

    # ---------- 静态多页路由精确匹配 ----------
    location / {
        try_files $uri $uri/ =404;
    }
}
